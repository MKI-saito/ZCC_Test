<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCC検証サイト</title>

<style>
body {
    font-family: "Yu Gothic", sans-serif;
    background-color: #f5f7fa;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 800px;
    margin: 100px auto;
    text-align: center;
}

h1 {
    color: #333;
    margin-bottom: 50px;
}

.button-area {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

.action-button {
    width: 400px;
    max-width: 90%;
    height: 80px;
    border: none;
    border-radius: 10px;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

.support {
    background-color: #0b5cff;
    color: white;
}

.freecall {
    background-color: #00a854;
    color: white;
}
</style>

<!-- Zoom Contact Center SDK -->
<script
    type="module"
    src="https://us01ccistatic.zoom.us/us01cci/web-sdk/zcc-sdk.js"
    data-apikey="WRjNn8TISFuzfK4O7-bRxA"
    data-env="us01">
</script>

</head>

<body>

<div class="container">

    <h1>お問い合わせ方法を選択してください</h1>

    <div class="button-area">

        <button
            class="action-button support"
            onclick="openSupport()">
            弊社サポートページへ接続
        </button>

        <button
            class="action-button freecall">
            フリーコールへ接続
        </button>

    </div>

</div>

<script>

window.addEventListener("zoomCampaignSdk:ready", () => {
    console.log("Zoom Contact Center SDK Ready");
});

function openSupport() {

    if (window.zoomCampaignSdk) {

        console.log("Opening Zoom Campaign");

        window.zoomCampaignSdk.open();

    } else {

        alert("Zoom SDKがまだ読み込まれていません");

    }
}

</script>

</body>
</html>
